experiment:
  protocol: mam_gate1_conditional_v1
  profile: full
  seeds: [31415, 27182, 16180, 14142, 17320]
  output_dir: outputs/mam/gate1_conditional_full
  intended_for_scientific_evidence: true
  warmup: true

numerics:
  compute_dtype: float32
  matmul_precision: highest

problem:
  horizon: 1.0
  steps: 64
  sigma: 0.8
  source_mean: [-1.5, 0.0]
  target_mean: [1.5, 0.0]
  marginal_variance: 0.05
  pair_batch_size: 1024

conditional:
  costate_steps: 256
  policy_iterations: 5
  maximum_consecutive_rejections: 3
  microbatch_size: 128
  effective_batch_size: 1024
  acceptance_size: 2048
  direct_score_size: 1024
  actor_model: nonlinear
  actor_training_steps: 512
  critic_training_steps: 512
  hidden_sizes: [128, 128]
  time_embedding_dim: 32
  learning_rate: 0.001
  actor_ridge: 0.001
  line_search: [1.0, 0.5, 0.25, 0.125, 0.0625]
  one_sided_z: 1.6448536269514722
  improvement_tolerance: 0.0001

evaluation:
  query_count: 512
  objective_sample_size: 4096
  mam_antithetic_pairs: 64
  direct_antithetic_pairs: 64
  reference_direct_antithetic_pairs: 4096
  reference_direct_replicates: 8
  path_integral_pairs: 512
  reference_path_integral_pairs: 4096
  reference_replicates: 8
  path_integral_shard_size: 8
  minimum_ess_fraction: 0.01
  boundary_bandwidth: 0.20
  minimum_boundary_effective_queries: 64

tasks:
  smooth_lqg:
    quadratic_weight: 2.0
    center: [0.0, 0.0]
  hard_disk:
    disk_center: [0.0, 0.0]
    disk_radius: 0.45
    occupancy_penalty: 12.0

gates:
  smooth_relative_l2: 0.05
  smooth_cosine: 0.995
  hard_boundary_relative_l2: 0.10
  hard_boundary_cosine: 0.99
  maximum_target_reference_relative_se: 0.02
  maximum_path_integral_reference_relative_se: 0.05
  maximum_target_reference_split_relative_l2: 0.08
  maximum_path_integral_reference_split_relative_l2: 0.20
  minimum_accepting_seeds: 4
  required_seeds: 5
  require_all_reference_queries_usable: true
