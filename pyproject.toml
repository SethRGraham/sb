[project]
name = "schrodinger-bridge"
version = "0.1.0"
description = "Production-grade Schrödinger Bridge library for JAX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Seth Graham" }
]
keywords = [
    "schrodinger-bridge",
    "optimal-transport",
    "stochastic-differential-equations",
    "jax",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
# Full installation with all optional features
full = [
    "matplotlib>=3.7.0",
    "ott-jax>=0.4.0",
    "pillow>=10.0.0",  # For GIF export
]

# Visualization only
viz = [
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
]

# Optimal transport integration
ott = [
    "ott-jax>=0.4.0",
]

# Diffrax integration
diffrax = [
    "diffrax>=0.6.1",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "marimo>=0.14.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]

# Documentation
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "nbsphinx>=0.9.0",
]

# Jupyter/notebook support
notebook = [
    "jupyter>=1.0.0",
    "marimo>=0.14.0",
    "matplotlib>=3.7.0",
    "ipywidgets>=8.0.0",
]

# GPU support (NVIDIA CUDA)
cuda13 = [
    "jax[cuda13]>=0.9.2; python_version >= '3.11'",
]

cuda12 = [
    "jax[cuda12]>=0.4.20",
]

# All optional dependencies
all = [
    "schrodinger-bridge[full,dev,docs,notebook,diffrax]",
]

[project.urls]
Homepage = "https://github.com/SethRGraham/sb"
Repository = "https://github.com/SethRGraham/sb"
Issues = "https://github.com/SethRGraham/sb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schrodinger_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/schrodinger_bridge",
    "/README.md",
    "/LICENSE",
]

# UV Configuration

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "marimo>=0.14.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]

# Ruff (linting)

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["schrodinger_bridge"]

# Mypy (type checking)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Pytest

[tool.pytest.ini_options]
testpaths = ["schrodinger_bridge/test"]
pythonpath = ["."]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
]

# Coverage

[tool.coverage.run]
source = ["schrodinger_bridge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
